<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generación del 27 - Buscador</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Autores de la Generación del 272</h1>

      <!-- Formulario con 3 parámetros de búsqueda -->
      <form id="searchForm">
        <input type="text" id="nombreInput" placeholder="Nombre del autor..." />
        <input
          type="text"
          id="epocaInput"
          placeholder="Época (ej. Generación del 27)..."
        />
        <input
          type="number"
          id="anoInput"
          placeholder="Año nacimiento mínimo..."
        />
        <button type="submit">Buscar</button>
      </form>

      <!-- Contenedor de Errores -->
      <div id="errorContainer" class="hidden"></div>

      <!-- Resultados (Nivel 1 y Nivel 2 de anidamiento) -->
      <section id="resultadosContainer" class="grid-autores"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
