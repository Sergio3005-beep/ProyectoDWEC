<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generación del 27 - Buscador</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Generación del 27</h1>

      <!-- Pestañas: cada una es una categoría de búsqueda -->
      <nav class="pestanas">
        <button type="button" class="pestana activa" data-panel="autores">Autores</button>
        <button type="button" class="pestana" data-panel="obras">Obras</button>
        <button type="button" class="pestana" data-panel="favoritos">Mis favoritos</button>
      </nav>

      <!-- Búsqueda 1: autores (API privada) - 3 parámetros -->
      <form id="formAutores" class="formulario">
        <input type="text" id="nombreInput" placeholder="Nombre del autor..." />
        <input type="text" id="lugarInput" placeholder="Lugar de nacimiento..." />
        <input
          type="number"
          id="anoInput"
          placeholder="Nacido a partir del año..."
          min="1800"
          max="2000"
        />
        <button type="submit">Buscar autores</button>
      </form>

      <!-- Búsqueda 2: obras (API pública) - 3 parámetros -->
      <form id="formObras" class="formulario hidden">
        <input type="text" id="tituloInput" placeholder="Título de la obra..." />
        <input type="text" id="autorInput" placeholder="Autor..." />
        <input
          type="number"
          id="anoObraInput"
          placeholder="Publicada a partir del año..."
          min="1000"
          max="2100"
        />
        <button type="submit">Buscar obras</button>
      </form>

      <!-- Mensajes -->
      <div id="errorContainer" class="mensaje error hidden"></div>
      <div id="infoContainer" class="mensaje info hidden"></div>

      <!-- Resultados -->
      <section id="resultados" class="grid"></section>

      <!-- Ventana con el detalle de una obra (nivel 3 de anidamiento) -->
      <dialog id="detalle">
        <div id="contenidoDetalle"></div>
        <p id="mensajeDetalle" class="mensaje-detalle"></p>
        <button type="button" id="cerrarDetalle" class="boton-secundario">Cerrar</button>
      </dialog>
    </main>

    <script src="api.js"></script>
    <script src="app.js"></script>
  </body>
</html>
